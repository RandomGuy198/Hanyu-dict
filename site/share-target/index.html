<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Share to Hanyu Dictionary</title>
    <meta name="robots" content="noindex" />
    <style>
      /* Inline tokens copied from src/styles/tokens.css — no external requests. */
      :root { --brand: #1f6f5c; --paper: #fbfaf6; --ink: #14211d; --muted: #40564c; --line: #e2ded2; --focus: #0b7285; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 1.5rem; }
      main { max-width: 34rem; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 1.5rem; box-shadow: 0 6px 18px rgba(20, 33, 29, 0.12); }
      h1 { font-size: 1.45rem; margin: 0 0 0.5rem; }
      p { color: var(--muted); margin: 0 0 1rem; }
      .value { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 0.75rem; margin: 0 0 1rem; word-break: break-word; }
      label { display: block; font-weight: 600; margin-bottom: 0.35rem; }
      input, textarea { width: 100%; padding: 0.6rem; border: 1px solid var(--line); border-radius: 10px; font: inherit; color: var(--ink); background: #fff; }
      .row { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
      a.btn, button { display: inline-block; padding: 0.6rem 1rem; border-radius: 10px; border: 1px solid var(--brand); background: var(--brand); color: #fff; font: inherit; text-decoration: none; cursor: pointer; }
      a.ghost { background: #fff; color: var(--brand); }
      :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      .status { font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Share to Hanyu Dictionary</h1>
      <p>This page receives content shared from other apps and hands you onward to the dictionary.</p>
      <div class="value" id="received" hidden></div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <div class="row" id="actions" hidden>
        <a class="btn" id="to-search" href="../index.html#/search">Search in Hanyu Dictionary</a>
        <a class="btn ghost" id="to-capture" href="../index.html#/capture">Open capture / OCR</a>
      </div>
      <form id="manual" method="get" action="../index.html">
        <label for="q">Or paste text to look up</label>
        <textarea id="q" name="q" rows="2" placeholder="e.g. 汉字 or “to learn”"></textarea>
        <div class="row">
          <button type="submit">Continue to the app</button>
          <a class="btn ghost" href="../index.html#/search">Open dictionary</a>
        </div>
      </form>
    </main>
    <script>
      // Read whatever the browser actually sent. Static hosting only ever delivers the
      // GET query string; a POST multipart file body is not readable by a plain page.
      (function () {
        var params = new URLSearchParams(location.search);
        var text = params.get("text") || "";
        var title = params.get("title") || "";
        var url = params.get("url") || "";
        var value = (text || url || title).trim();
        var status = document.getElementById("status");
        var received = document.getElementById("received");
        var actions = document.getElementById("actions");
        if (value) {
          received.hidden = false;
          received.textContent = value;
          status.textContent = "Received shared text. Continue to search it, or capture an image.";
          document.getElementById("to-search").href = "../index.html#/search?q=" + encodeURIComponent(value);
          document.getElementById("to-capture").href = "../index.html#/capture";
          actions.hidden = false;
          document.getElementById("q").value = value;
        } else if (params.get("file")) {
          status.textContent = "The browser referenced a file (" + params.get("file") + "), but a static page cannot read shared image data. Open capture to paste it yourself.";
          document.getElementById("to-capture").href = "../index.html#/capture";
          actions.hidden = false;
        } else {
          status.textContent = "Nothing usable arrived. Some browsers only send text over GET and cannot deliver images to a static page. Paste text below, or open the app directly.";
        }
      })();
    </script>
  </body>
</html>
