# Publishes the app to GitHub Pages from a freshly built `dist/`.
#
# v0.2 deployment shape: GitHub Actions is the *only* deployment mechanism (D-03). The duplicate
# committed `site/` folder and the `npm run pages:sync` script were retired so the repository is
# half its former size; there is no committed build output to go stale.
#
# Gates run in this order, each of which can stop the publication:
#   1. npm ci
#   2. npm run data:check      - committed packs match public/data/manifest.json + provenance.json
#   3. npm run legal:check     - no book material, secrets, CDNs or forbidden identifiers in the tree
#   4. npm run typecheck
#   5. npm test
#   6. npm run build:only      - production bundle with the build-time CSP
#   7. npm run legal:check     - again, over dist/
#   8. artifact completeness gate (PWA members, relative asset URLs, parseable JSON)
#
# No secret is read here: the only credential is the run's own GITHUB_TOKEN for the Pages deploy.
# The app itself never ships a token - the owner pastes a fine-grained PAT into the running app,
# and it is stored only in that browser's localStorage.

name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  build-and-deploy:
    name: Build from source and deploy dist/
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci --no-audit --no-fund

      - name: Provenance and licence gate (offline, from the committed packs)
        run: npm run data:check

      - name: Public/private legal boundary gate (tracked tree)
        run: npm run legal:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build:only

      - name: Public/private legal boundary gate (dist/)
        run: npm run legal:check

      - name: Artifact completeness gate
        shell: bash
        env:
          PWA_ROOT: dist
        run: |
          set -uo pipefail
          root="${PWA_ROOT}"
          for f in index.html manifest.webmanifest sw.js \
                   data/manifest.json \
                   data/packs/dictionary-core/000.txt \
                   data/packs/characters/000.txt \
                   licenses/THIRD_PARTY_NOTICES.md \
                   licenses/RUNTIME_NOTICES.md; do
            if [ ! -s "${root}/$f" ]; then
              echo "::error title=Refusing to publish::${root}/$f is missing or empty. The app cannot install, find its packs or satisfy its attribution duties without it."
              exit 1
            fi
          done
          grep -q 'http-equiv="Content-Security-Policy"' "${root}/index.html" || {
            echo "::error title=Refusing to publish::index.html has no CSP meta tag, so the build-time plugin in vite.config.ts did not run. Pages cannot send headers; this tag is the policy."
            exit 1
          }
          if grep -qE '(src|href)="/[^/]' "${root}/index.html"; then
            echo "::error title=Refusing to publish::index.html uses absolute asset URLs. base './' was not applied."
            exit 1
          fi
          grep -ohE '(src|href)="\.\/[^"]+"' "${root}/index.html" | sed -E 's/.*="\.\/([^"]+)".*/\1/' \
            | while IFS= read -r ref; do
                if [ ! -e "${root}/${ref}" ]; then
                  echo "::error title=Broken asset reference::index.html references ./${ref}, which is not in the artifact."
                  exit 1
                fi
              done || exit 1
          for j in "${root}/manifest.webmanifest" "${root}/data/manifest.json"; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$j" || {
              echo "::error title=Unparseable JSON::$j is not valid JSON."
              exit 1
            }
          done
          echo "Artifact size: $(du -sh "${root}" | cut -f1); pack families: $(find "${root}/data/packs" -mindepth 1 -maxdepth 1 -type d | wc -l)"

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Upload the dist/ artifact as the Pages site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Published URL
        if: steps.deployment.outcome == 'success'
        env:
          PAGE_URL: ${{ steps.pages.outputs.page_url }}
        shell: bash
        run: |
          {
            echo "## Pages deployment"
            echo
            echo "Served from a freshly built \`dist/\`: **${PAGE_URL:-see Settings -> Pages}**"
            echo
            echo "Routes are hash-based (\`#/entry/...\`), so deep links need no server rewrite rule."
          } >> "$GITHUB_STEP_SUMMARY"
